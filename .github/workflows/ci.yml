name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # stylua.toml uses Windows line endings, so check on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format, lint, unit tests, and model build
        shell: pwsh
        run: ./scripts/verify.ps1
